name: Build

on:
  push:
  pull_request:
  release:
    types:
      - published

concurrency:
  group: "build"
  cancel-in-progress: true

env:
  # free-threaded wheels (cp314t and above) are built by default since cibuildwheel 4.0
  # cp315 is skipped until numpy publishes Python 3.15 wheels (faery depends on numpy)
  CIBW_SKIP: cp315-* cp315t-* *i686 *win32 cp39-win_arm64 cp310-win_arm64

  # cibuildhweel macOS configuration
  CIBW_ARCHS_MACOS: native

  # cibuildhweel linux configuration
  CIBW_ARCHS_LINUX: native
  CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
  CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
  # On Linux, wheels are built inside a container on the GitHub runner (unlike macOS and Windows which use the GitHub runner directly)
  # Any build dependencies must thus be installed on the container (using CIBW_BEFORE_ALL_LINUX), *not* on the runner with the regular workflow
  # This command must be compatible with manylinux_2_28 (AlmaLinux 8) and musllinux_1_2 (Alpine Linux 3.20)
  CIBW_BEFORE_ALL_LINUX: dnf install -y clang nasm; apk add clang-dev nasm; curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=stable --profile=minimal -y
  CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'

  # cibuildhweel Windows configuration
  CIBW_ARCHS_WINDOWS: native
  CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --exclude ext-ms-* --exclude opengl32.dll --exclude glu32.dll -w {dest_dir} -v {wheel}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner, macos-latest is an ARM runner
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.17
      - run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV
        if: startsWith(matrix.os, 'macos')
      - run: |
          brew install nasm
          uvx cibuildwheel==4.2.1
        if: startsWith(matrix.os, 'macos-15-intel')
      - run: uvx cibuildwheel==4.2.1
        if: startsWith(matrix.os, 'macos-latest')
      - run: uvx cibuildwheel==4.2.1
        if: startsWith(matrix.os, 'ubuntu-latest')
      - run: uvx cibuildwheel==4.2.1
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
      # nasm assembles x264's x86 SIMD; the ARM64 build uses its own assembly instead
      - run: |
          choco install nasm || exit /b 1
          echo C:\Program Files\NASM>> %GITHUB_PATH%
        shell: cmd
        if: matrix.os == 'windows-latest'
      - run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires ${{ matrix.os == 'windows-11-arm' && 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' || 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }} -property installationPath`) do set "VISUAL_STUDIO_PATH=%%i"
          if not defined VISUAL_STUDIO_PATH (
            echo no Visual Studio installation with the C++ toolchain found
            exit /b 1
          )
          echo VISUAL_STUDIO_PATH=%VISUAL_STUDIO_PATH%>> %GITHUB_ENV%
          echo FAERY_BUILD_BASH=C:\Program Files\Git\bin\bash.exe>> %GITHUB_ENV%
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - run: choco install make || exit /b 1
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - run: |
          call "%VISUAL_STUDIO_PATH%\VC\Auxiliary\Build\${{ matrix.os == 'windows-11-arm' && 'vcvarsarm64' || 'vcvars64' }}.bat" || exit /b 1
          where cl || exit /b 1
          where make || exit /b 1
          uvx cibuildwheel==4.2.1
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: wheelhouse
  test_library:
    name: Test library on ${{ matrix.os }} with Python ${{ matrix.python }} and numpy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    needs: [build_wheels]
    strategy:
      matrix:
        numpy: ["==1.26.4", ">=2"]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        # macos-15-intel is an Intel runner, macos-latest is an ARM runner
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        exclude:
          # this configuration yields 'Windows fatal exception: access violation'
          # this may get fixed in a maintenance upgrade of 1.26.x (x > 4)
          - numpy: ==1.26.4
            os: windows-latest
            python: "3.13"
          # numpy 1.26.4 does not support Python 3.14
          - numpy: ==1.26.4
            python: "3.14"
          - numpy: ==1.26.4
            python: "3.14t"
          # numpy has no Windows ARM64 wheels before 2.3.0 and none at all for Python 3.9 and 3.10
          - numpy: ==1.26.4
            os: windows-11-arm
          - os: windows-11-arm
            python: "3.9"
          - os: windows-11-arm
            python: "3.10"
    steps:
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.17
          python-version: ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.python) || matrix.python }}
          activate-environment: true
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: wheelhouse
      - run: python --version
      - run: uv pip install 'numpy${{ matrix.numpy }}'
      - run: uv pip install --group tests
      - run: uv pip install --no-index --find-links wheelhouse faery
      - run: python -c 'import faery'
      - run: python -c 'import sys, faery; assert not sys._is_gil_enabled(), "importing faery re-enabled the GIL"'
        if: endsWith(matrix.python, 't')
      - run: python -m pytest tests/
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.17
      - run: uvx --from build==1.6.1 pyproject-build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.tar.gz
  test_sdist:
    name: Test source distribution on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: [build_sdist]
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        # macos-15-intel is an Intel runner, macos-latest is an ARM runner
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        exclude:
          # numpy has no Windows ARM64 wheels for Python 3.9 and 3.10
          - os: windows-11-arm
            python: "3.9"
          - os: windows-11-arm
            python: "3.10"
    steps:
      # this job deliberately does not check out the repository
      # building from the downloaded artifact proves that the source distribution is self-contained
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.17
          python-version: ${{ matrix.os == 'windows-11-arm' && format('cpython-{0}-windows-aarch64-none', matrix.python) || matrix.python }}
          activate-environment: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: python --version
      - run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> $GITHUB_ENV
        if: startsWith(matrix.os, 'macos')
      # the wheel job builds Linux wheels in a container and installs these with CIBW_BEFORE_ALL_LINUX
      # the source distribution is compiled on the runner itself, so x264's dependencies are installed here
      - run: sudo apt-get update && sudo apt-get install --yes clang nasm
        if: startsWith(matrix.os, 'ubuntu')
      - run: brew install nasm
        if: matrix.os == 'macos-15-intel'
      - run: |
          uv pip install dist/*.tar.gz
          python -c 'import faery'
        shell: bash
        if: ${{ !startsWith(matrix.os, 'windows') }}
      # nasm assembles x264's x86 SIMD; the ARM64 build uses its own assembly instead
      - run: |
          choco install nasm || exit /b 1
          echo C:\Program Files\NASM>> %GITHUB_PATH%
        shell: cmd
        if: matrix.os == 'windows-latest'
      - run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires ${{ matrix.os == 'windows-11-arm' && 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' || 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }} -property installationPath`) do set "VISUAL_STUDIO_PATH=%%i"
          if not defined VISUAL_STUDIO_PATH (
            echo no Visual Studio installation with the C++ toolchain found
            exit /b 1
          )
          echo VISUAL_STUDIO_PATH=%VISUAL_STUDIO_PATH%>> %GITHUB_ENV%
          echo FAERY_BUILD_BASH=C:\Program Files\Git\bin\bash.exe>> %GITHUB_ENV%
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - run: choco install make || exit /b 1
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - run: |
          call "%VISUAL_STUDIO_PATH%\VC\Auxiliary\Build\${{ matrix.os == 'windows-11-arm' && 'vcvarsarm64' || 'vcvars64' }}.bat" || exit /b 1
          where cl || exit /b 1
          where make || exit /b 1
          for %%f in (dist\*.tar.gz) do uv pip install %%f || exit /b 1
          python -c "import faery" || exit /b 1
        shell: cmd
        if: startsWith(matrix.os, 'windows')
      - run: python -c 'import sys, faery; assert not sys._is_gil_enabled(), "importing faery re-enabled the GIL"'
        if: endsWith(matrix.python, 't')
  upload_pypi:
    name: Upload wheels and sidst to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, test_library, build_sdist, test_sdist]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: "*"
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mv wheelhouse/* dist/
      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
