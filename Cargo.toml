[package]
name = "python"
edition = "2021"
resolver = "2"

[lib]
name = "faery"
crate-type = ["cdylib", "rlib"]

[dependencies]
flatbuffers = "25.12.19"
fontdue = "0.9.4"
gifski = {version = "1.34.0", default-features = false}
image = {version = "0.25.10", default-features = false, features = ["png"]}
lz4 = "1.28.1"
mp4 = "0.14.0"
mustache = "0.9.0"
neuromorphic-types = "0.6.0"
numpy = {version = "0.29.0"}
pyo3 = {version = "0.29.2", features = ["extension-module"]}
resvg = "0.48.1"
roxmltree = "0.21.1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
slint = "1.13.1"
thiserror = "2.0"
toml = "1.1.6"
zstd = "0.14.0"

[build-dependencies]
bindgen = "0.72.1"

[profile.release]
codegen-units = 1
lto = true
